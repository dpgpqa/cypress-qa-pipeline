version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      cypress-deps:
        patterns:
          - "cypress"
          - "@types/cypress"
          - "cypress-*"
      lint-deps:
        patterns:
          - "eslint"
          - "@typescript-eslint/*"
      typescript-deps:
        patterns:
          - "typescript"
          - "@types/node"