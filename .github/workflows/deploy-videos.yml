name: Deploy Videos to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write

jobs:
  deploy-videos:
    name: Deploy Videos to gh-pages
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all video artifacts
        run: |
          mkdir -p videos/smoke videos/regression videos/api videos/a11y videos/visual
          RUN_ID=${{ github.event.workflow_run.id }}
          ARTIFACTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts")
          echo "$ARTIFACTS" | grep -o '"name":"[^"]*-videos"' | while read -r line; do
            ARTIFACT_NAME=$(echo "$line" | grep -o '"name":"[^"]*"' | cut -d'"' -f4)
            SUITE=$(echo "$ARTIFACT_NAME" | sed 's/-videos//')
            echo "Downloading $ARTIFACT_NAME for suite $SUITE"
            DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
              | grep -o "\"name\":\"$ARTIFACT_NAME\".*\"archive_download_url\":\"[^\"]*\"" \
              | grep -o '"archive_download_url":"[^"]*"' | cut -d'"' -f4)
            if [ -n "$DOWNLOAD_URL" ]; then
              curl -s -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "$DOWNLOAD_URL" -o "/tmp/$ARTIFACT_NAME.zip"
              unzip -o -j "/tmp/$ARTIFACT_NAME.zip" "*.mp4" -d "videos/$SUITE/" 2>/dev/null || true
              rm -f "/tmp/$ARTIFACT_NAME.zip"
            fi
          done
      - name: Generate videos.json
        run: |
          echo "{" > videos.json
          FIRST=true
          for SUITE in smoke regression api a11y visual; do
            if [ -d "videos/$SUITE" ] && [ "$(ls -A videos/$SUITE/)" ]; then
              if [ "$FIRST" = true ]; then FIRST=false; else echo "," >> videos.json; fi
              echo "  \"$SUITE\": [" >> videos.json
              LS_FIRST=true
              for FILE in videos/$SUITE/*.mp4; do
                if [ -f "$FILE" ]; then
                  if [ "$LS_FIRST" = true ]; then LS_FIRST=false; else echo "," >> videos.json; fi
                  BASENAME=$(basename "$FILE")
                  echo "    {\"name\": \"$BASENAME\", \"path\": \"/videos/$SUITE/$BASENAME\"}" >> videos.json
                fi
              done
              echo "  ]" >> videos.json
            fi
          done
          echo "}" >> videos.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/ videos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add test videos from CI run ${{ github.event.workflow_run.id }}"
            git push origin gh-pages
          fi