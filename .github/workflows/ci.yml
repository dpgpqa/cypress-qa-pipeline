name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint 2>&1 || true
      - run: npm run typecheck 2>&1 || true

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run smoke tests
        run: npm run test:smoke 2>&1 || true
        env:
          BASE_URL: https://www.saucedemo.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: cypress/screenshots/
          retention-days: 7

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run regression tests
        run: npm run test:regression 2>&1 || true
        env:
          BASE_URL: https://www.saucedemo.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-screenshots
          path: cypress/screenshots/
          retention-days: 7

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run API tests
        run: npm run test:api 2>&1 || true
        env:
          API_BASE_URL: https://jsonplaceholder.typicode.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-screenshots
          path: cypress/screenshots/
          retention-days: 7

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run accessibility tests
        run: npm run test:a11y 2>&1 || true
        env:
          BASE_URL: https://www.saucedemo.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-screenshots
          path: cypress/screenshots/
          retention-days: 7

  visual-regression-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run visual regression tests
        run: npm run test:visual 2>&1 || true
        env:
          BASE_URL: https://www.saucedemo.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-screenshots
          path: cypress/screenshots/
          retention-days: 7

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, api-tests, accessibility-tests, visual-regression-tests]
    if: always()
    steps:
      - run: echo "Todos los jobs terminaron. Revisa artifacts para videos y screenshots."

  deploy-videos:
    name: Deploy Videos to GitHub Pages
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, api-tests, accessibility-tests, visual-regression-tests]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download smoke videos
        uses: actions/download-artifact@v4
        with:
          name: smoke-videos
          path: /tmp/smoke-videos
        continue-on-error: true
      - name: Download regression videos
        uses: actions/download-artifact@v4
        with:
          name: regression-videos
          path: /tmp/regression-videos
        continue-on-error: true
      - name: Download API videos
        uses: actions/download-artifact@v4
        with:
          name: api-videos
          path: /tmp/api-videos
        continue-on-error: true
      - name: Download accessibility videos
        uses: actions/download-artifact@v4
        with:
          name: a11y-videos
          path: /tmp/a11y-videos
        continue-on-error: true
      - name: Download visual videos
        uses: actions/download-artifact@v4
        with:
          name: visual-videos
          path: /tmp/visual-videos
        continue-on-error: true
      - name: Organize videos and generate videos.json
        run: |
          mkdir -p videos/smoke videos/regression videos/api videos/a11y videos/visual
          find /tmp/smoke-videos -name "*.mp4" -exec cp {} videos/smoke/ \; 2>/dev/null || true
          find /tmp/regression-videos -name "*.mp4" -exec cp {} videos/regression/ \; 2>/dev/null || true
          find /tmp/api-videos -name "*.mp4" -exec cp {} videos/api/ \; 2>/dev/null || true
          find /tmp/a11y-videos -name "*.mp4" -exec cp {} videos/a11y/ \; 2>/dev/null || true
          find /tmp/visual-videos -name "*.mp4" -exec cp {} videos/visual/ \; 2>/dev/null || true

          echo "{" > videos.json
          FIRST_SUITE=true
          for SUITE in smoke regression api a11y visual; do
            if [ -d "videos/$SUITE" ] && [ -n "$(ls -A videos/$SUITE/*.mp4 2>/dev/null)" ]; then
              if [ "$FIRST_SUITE" = true ]; then FIRST_SUITE=false; else echo "," >> videos.json; fi
              echo "  \"$SUITE\": [" >> videos.json
              FIRST_FILE=true
              for FILE in videos/$SUITE/*.mp4; do
                if [ -f "$FILE" ]; then
                  if [ "$FIRST_FILE" = true ]; then FIRST_FILE=false; else echo "," >> videos.json; fi
                  BASENAME=$(basename "$FILE")
                  echo "    {\"name\": \"$BASENAME\", \"path\": \"videos/$SUITE/$BASENAME\"}" >> videos.json
                fi
              done
              echo "  ]" >> videos.json
            fi
          done
          echo "}" >> videos.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/ videos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add test videos from CI run ${{ github.run_id }}"
            git push origin gh-pages
          fi