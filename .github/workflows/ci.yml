name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint 2>&1 || true
      - run: npm run typecheck 2>&1 || true

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run smoke tests
        run: npm run test:smoke 2>&1 || true
        env:
          BASE_URL: https://www.saucedemo.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: cypress/screenshots/
          retention-days: 7

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run regression tests
        run: npm run test:regression 2>&1 || true
        env:
          BASE_URL: https://www.saucedemo.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-screenshots
          path: cypress/screenshots/
          retention-days: 7

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run API tests
        run: npm run test:api 2>&1 || true
        env:
          API_BASE_URL: https://jsonplaceholder.typicode.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-screenshots
          path: cypress/screenshots/
          retention-days: 7

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run accessibility tests
        run: npm run test:a11y 2>&1 || true
        env:
          BASE_URL: https://www.saucedemo.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-screenshots
          path: cypress/screenshots/
          retention-days: 7

  visual-regression-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run visual regression tests
        run: npm run test:visual 2>&1 || true
        env:
          BASE_URL: https://www.saucedemo.com
      - name: Upload videos (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-videos
          path: cypress/videos/
          retention-days: 7
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-screenshots
          path: cypress/screenshots/
          retention-days: 7

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, api-tests, accessibility-tests, visual-regression-tests]
    if: always()
    steps:
      - run: echo "Todos los jobs terminaron. Revisa artifacts para videos y screenshots."