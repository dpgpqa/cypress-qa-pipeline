<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SauceDemo - Login</title>
</head>
<body>
  <div id="login_container">
    <div id="login_credential_box">
      <div class="login_box">
        <form id="login_button_container" action="/login" method="POST">
          <input id="user-name" data-test="username" placeholder="Username" />
          <input id="password" data-test="password" type="password" placeholder="Password" />
          <input class="submit-button btn_action" data-test="login-button" type="submit" value="Login" />
          <h3 data-test="error">Epic sadface: Username and password do not match any user in this service</h3>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
