<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SauceDemo - Cart</title>
</head>
<body>
  <div class="cart_container">
    <div class="cart_list">
      <div class="cart_item" data-test="inventory-item">
        <div class="inventory_item_name">Sauce Labs Backpack</div>
        <button class="btn_action" data-test="remove-sauce-labs-backpack">Remove</button>
      </div>
    </div>
    <div class="checkout_buttons">
      <button class="checkout_button" data-test="checkout">Checkout</button>
      <button class="continue_shopping_button" data-test="continue-shopping">Continue Shopping</button>
    </div>
  </div>
</body>
</html>
