<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SauceDemo - Checkout Overview</title>
</head>
<body>
  <div class="checkout_container">
    <div class="cart_list">
      <div class="cart_item" data-test="inventory-item">
        <div class="inventory_item_name">Sauce Labs Backpack</div>
        <div class="inventory_item_price">$29.99</div>
      </div>
    </div>
    <div class="summary_info">
      <div class="summary_subtotal_label"><div class="summary_value_label">Item total: $29.99</div></div>
      <div class="summary_tax_label"><div class="summary_value_label">Tax: $2.40</div></div>
      <div class="summary_total_label"><div class="summary_value_label">Total: $32.39</div></div>
    </div>
    <button class="btn_action cart_button" data-test="finish">Finish</button>
    <button class="btn_secondary cart_cancel_link" data-test="cancel">Cancel</button>
  </div>
</body>
</html>
